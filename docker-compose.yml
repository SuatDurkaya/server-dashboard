services:
  dashboard:
    build: .
    ports:
      - "5000:5000"
    restart: always

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    restart: always
  node-exporter:
    image: prom/node-exporter
    ports:
      - "9100:9100"
    restart: always
